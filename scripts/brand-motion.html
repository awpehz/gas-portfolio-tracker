<!doctype html><html><head><meta charset="utf8"><style>
  html,body{margin:0;width:1600px;height:500px;background:transparent;overflow:hidden}
  #stage{
    width:1600px;height:500px;display:flex;align-items:center;justify-content:center;gap:34px;
    font-family:"Inter","SF Pro Text",-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  /* flame */
  .flame{width:210px;height:250px;overflow:visible;
    animation:ignite 620ms cubic-bezier(.2,1,.3,1) both, fglow 3.4s ease-in-out 700ms infinite;}
  .flame .fo{transform-box:fill-box;transform-origin:50% 100%;animation:sw 2.7s ease-in-out 700ms infinite;}
  .flame .fc{transform-box:fill-box;transform-origin:50% 100%;animation:br 1.7s ease-in-out 700ms infinite;}
  .flame .fk{transform-box:fill-box;transform-origin:50% 70%;animation:fl .95s ease-in-out 700ms infinite;}
  @keyframes ignite{from{transform:translateY(60px) scale(.2);opacity:0;filter:blur(14px)}to{transform:none;opacity:1;filter:blur(0)}}
  @keyframes fglow{0%,100%{filter:drop-shadow(0 0 14px rgba(78,168,255,.5))}50%{filter:drop-shadow(0 0 34px rgba(124,196,255,.9))}}
  @keyframes sw{0%,100%{transform:skewX(0) scale(1,1)}25%{transform:skewX(-3deg) scale(.97,1.05)}60%{transform:skewX(2deg) scale(1.03,.96)}}
  @keyframes br{0%,100%{transform:scale(1,1);opacity:.92}40%{transform:scale(.92,1.13);opacity:1}}
  @keyframes fl{0%,100%{opacity:.8;transform:scale(1)}40%{opacity:1;transform:scale(1.2,1.3)}}

  /* wordmark */
  .word{position:relative;overflow:hidden}
  .word h1{
    margin:0;font-size:92px;font-weight:800;letter-spacing:-.03em;line-height:1;white-space:nowrap;
    background:linear-gradient(180deg,#ffffff,#a9c6e6);-webkit-background-clip:text;background-clip:text;color:transparent;
    clip-path:inset(0 100% 0 0);
    animation:wipe 620ms cubic-bezier(.2,1,.3,1) 560ms both;
  }
  .word .sub{
    margin-top:14px;font-size:23px;font-weight:600;letter-spacing:.02em;color:#7cc4ff;
    text-shadow:0 0 14px rgba(78,168,255,.55);
    opacity:0;transform:translateY(8px);
    animation:rise 500ms ease 1050ms both;
  }
  .word .shine{
    position:absolute;top:0;left:-40%;width:35%;height:100%;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-18deg);opacity:0;
    animation:shine 900ms ease 1150ms both;
  }
  @keyframes wipe{to{clip-path:inset(0 0 0 0)}}
  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes shine{0%{left:-40%;opacity:0}25%{opacity:1}100%{left:120%;opacity:0}}
</style></head>
<body>
<div id="stage">
  <svg class="flame" viewBox="0 0 24 24" aria-hidden>
    <defs>
      <linearGradient id="fg" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#2338a8"/><stop offset=".36" stop-color="#2c78f2"/>
        <stop offset=".7" stop-color="#5cb4ff"/><stop offset="1" stop-color="#eaf5ff"/>
      </linearGradient>
      <linearGradient id="cg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#84cbff"/><stop offset="1" stop-color="#fff"/></linearGradient>
    </defs>
    <path class="fo" d="M12.3 1.7C15.9 6 18.7 9.1 18.7 13.1 18.7 18.1 15.5 21.8 12 22.3 8.5 21.8 5.3 18.4 5.3 13 5.3 8.6 8.7 4.7 12.3 1.7Z" fill="url(#fg)"/>
    <path class="fc" d="M12 9C13.7 11.8 14.6 13.8 14.6 16 14.6 19 13.2 20.9 12 21.1 10.6 20.9 9.4 19 9.4 16.3 9.4 13.9 10.6 11.7 12 9Z" fill="url(#cg)"/>
    <ellipse class="fk" cx="12" cy="17.3" rx="1.8" ry="3" fill="#fff"/>
  </svg>
  <div class="word">
    <h1>Gas Portfolio Tracker</h1>
    <div class="sub">know if you&rsquo;ll hit the deadline</div>
    <div class="shine"></div>
  </div>
</div>
</body></html>
