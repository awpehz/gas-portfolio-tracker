<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fl" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2338a8"/>
      <stop offset=".36" stop-color="#2c78f2"/>
      <stop offset=".70" stop-color="#5cb4ff"/>
      <stop offset="1" stop-color="#eaf5ff"/>
    </linearGradient>
    <linearGradient id="cn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#84cbff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="vi" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3626c8"/>
      <stop offset=".55" stop-color="#6d3ff2"/>
      <stop offset="1" stop-color="#b58cff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#61728f"/>
      <stop offset="1" stop-color="#29313f"/>
    </linearGradient>
    <radialGradient id="bg" cx=".5" cy=".36" r=".78">
      <stop offset="0" stop-color="#222736"/>
      <stop offset="1" stop-color="#080910"/>
    </radialGradient>
    <radialGradient id="bloom" cx=".5" cy=".60" r=".5">
      <stop offset="0" stop-color="#2f8fff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2f8fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="b8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="b34" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="34"/></filter>
    <clipPath id="sq"><rect x="104" y="104" width="816" height="816" rx="196"/></clipPath>
  </defs>

  <rect x="104" y="104" width="816" height="816" rx="196" fill="url(#bg)"/>

  <g clip-path="url(#sq)">
    <ellipse cx="512" cy="620" rx="250" ry="300" fill="url(#bloom)" filter="url(#b34)"/>

    <!-- violet mantle: same flame silhouette, grown about its centre -->
    <g filter="url(#b8)" opacity=".55" transform="translate(512 566) scale(1.05) translate(-512 -566)">
      <path d="M512 236 C596 360 664 458 664 582 C664 710 596 784 512 806 C428 784 360 710 360 578 C360 452 452 360 512 236 Z" fill="url(#vi)"/>
    </g>

    <!-- burner bar -->
    <rect x="374" y="802" width="276" height="28" rx="14" fill="url(#bar)"/>
    <rect x="374" y="802" width="276" height="8" rx="4" fill="#8b9cbb" opacity=".7"/>
    <g fill="#0a0c12">
      <rect x="405" y="809" width="25" height="13" rx="5"/>
      <rect x="456" y="809" width="25" height="13" rx="5"/>
      <rect x="499" y="809" width="25" height="13" rx="5"/>
      <rect x="542" y="809" width="25" height="13" rx="5"/>
      <rect x="593" y="809" width="25" height="13" rx="5"/>
    </g>

    <!-- side tongues -->
    <path d="M434 804 c1-38 16-54 16-54 s15 16 16 54 z" fill="url(#fl)" opacity=".85"/>
    <path d="M592 804 c1-38 16-54 16-54 s15 16 16 54 z" fill="url(#fl)" opacity=".85"/>

    <!-- main flame: single clean tip, gentle lean -->
    <path d="M516 236
             C600 360 668 458 668 586
             C668 712 598 786 512 806
             C426 784 356 710 356 576
             C356 446 452 356 516 236 Z" fill="url(#fl)"/>

    <!-- inner cone -->
    <path d="M512 412
             C556 478 582 528 582 582
             C582 664 550 714 512 728
             C472 714 444 662 444 576
             C444 522 476 466 512 412 Z" fill="url(#cn)"/>
  </g>

  <rect x="104" y="104" width="816" height="816" rx="196" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="2"/>
</svg>
