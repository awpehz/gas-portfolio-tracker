<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".36" r=".85">
      <stop offset="0" stop-color="#20293a"/>
      <stop offset=".55" stop-color="#121722"/>
      <stop offset="1" stop-color="#080a10"/>
    </radialGradient>
    <linearGradient id="fl" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2338a8"/>
      <stop offset=".34" stop-color="#2c78f2"/>
      <stop offset=".68" stop-color="#5cb4ff"/>
      <stop offset="1" stop-color="#eaf5ff"/>
    </linearGradient>
    <linearGradient id="cn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7ec8ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="bloom" cx=".5" cy=".58" r=".5">
      <stop offset="0" stop-color="#3a8fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3a8fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <clipPath id="sq"><rect x="104" y="104" width="816" height="816" rx="196"/></clipPath>
  </defs>

  <rect x="104" y="104" width="816" height="816" rx="196" fill="url(#bg)"/>

  <g clip-path="url(#sq)">
    <ellipse cx="512" cy="600" rx="300" ry="330" fill="url(#bloom)" filter="url(#soft)"/>
    <!-- brand flame — same silhouette as the wordmark mark, 24u path scaled ~25x about centre -->
    <g transform="translate(512 512) scale(25.4) translate(-12 -12.2)">
      <path d="M12.3 1.7C15.9 6 18.7 9.1 18.7 13.1 18.7 18.1 15.5 21.8 12 22.3 8.5 21.8 5.3 18.4 5.3 13 5.3 8.6 8.7 4.7 12.3 1.7Z" fill="url(#fl)"/>
      <path d="M12 9C13.7 11.8 14.6 13.8 14.6 16 14.6 19 13.2 20.9 12 21.1 10.6 20.9 9.4 19 9.4 16.3 9.4 13.9 10.6 11.7 12 9Z" fill="url(#cn)"/>
      <ellipse cx="12" cy="17.3" rx="1.8" ry="3" fill="#fff"/>
    </g>
    <!-- inner shadow at the base so the flame feels seated -->
    <rect x="104" y="104" width="816" height="816" rx="196" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="40" filter="url(#soft)"/>
  </g>

  <!-- crisp rim light -->
  <rect x="104" y="104" width="816" height="816" rx="196" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="2"/>
</svg>
