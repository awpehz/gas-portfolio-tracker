<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <link rel="stylesheet" href="style.css" />
  <title>Gas Portfolio Tracker</title>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#2338a8" />
        <stop offset="0.36" stop-color="#2c78f2" />
        <stop offset="0.70" stop-color="#5cb4ff" />
        <stop offset="1" stop-color="#eaf5ff" />
      </linearGradient>
      <linearGradient id="flameCone" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#84cbff" />
        <stop offset="1" stop-color="#ffffff" />
      </linearGradient>
    </defs>
  </svg>

  <div id="splash">
    <div class="splash-mark">
      <svg class="flame xl" viewBox="0 0 24 24"><path class="f-outer" d="M12.3 1.7C15.9 6 18.7 9.1 18.7 13.1 18.7 18.1 15.5 21.8 12 22.3 8.5 21.8 5.3 18.4 5.3 13 5.3 8.6 8.7 4.7 12.3 1.7Z" fill="url(#flameGrad)"/><path class="f-cone" d="M12 9C13.7 11.8 14.6 13.8 14.6 16 14.6 19 13.2 20.9 12 21.1 10.6 20.9 9.4 19 9.4 16.3 9.4 13.9 10.6 11.7 12 9Z" fill="url(#flameCone)"/><ellipse class="f-core" cx="12" cy="17.3" rx="1.8" ry="3" fill="#fff"/></svg>
    </div>
    <div class="splash-name">Gas Portfolio Tracker</div>
    <div class="splash-sub">made by Connor W</div>
  </div>

  <header class="titlebar">
    <span class="tb-title">
      <svg class="flame" viewBox="0 0 24 24"><path class="f-outer" d="M12.3 1.7C15.9 6 18.7 9.1 18.7 13.1 18.7 18.1 15.5 21.8 12 22.3 8.5 21.8 5.3 18.4 5.3 13 5.3 8.6 8.7 4.7 12.3 1.7Z" fill="url(#flameGrad)"/><path class="f-cone" d="M12 9C13.7 11.8 14.6 13.8 14.6 16 14.6 19 13.2 20.9 12 21.1 10.6 20.9 9.4 19 9.4 16.3 9.4 13.9 10.6 11.7 12 9Z" fill="url(#flameCone)"/><ellipse class="f-core" cx="12" cy="17.3" rx="1.8" ry="3" fill="#fff"/></svg>
      Gas Portfolio Tracker
    </span>
    <div class="tb-btns">
      <button id="widget" title="Widget mode">◱</button>
      <button id="pin" title="Keep on top">pin</button>
      <button id="min" title="Minimise">–</button>
      <button id="close" title="Close">×</button>
    </div>
  </header>

  <div id="update" class="update" hidden></div>
  <main id="app"></main>
  <footer class="credit">Gas Portfolio Tracker — made by Connor W</footer>

  <script src="logic.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
